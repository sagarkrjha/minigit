name: Reusable Build

on:
  workflow_call:
    inputs:
      build_type:
        description: 'CMake build type (Release, Debug, RelWithDebInfo)'
        required: false
        default: 'Release'
        type: string
      upload_artifacts:
        description: 'Whether to upload binary artifacts'
        required: false
        default: true
        type: boolean

  workflow_dispatch:
    inputs:
      build_type:
        description: 'CMake build type'
        required: false
        default: 'Release'
        type: choice
        options:
          - Release
          - Debug
          - RelWithDebInfo
      upload_artifacts:
        description: 'Whether to upload binary artifacts'
        required: false
        default: true
        type: boolean

env:
  FORCE_JAVASCRIPT_ACTIONS_TO_NODE24: true

jobs:
  compile:
    name: Build (${{ matrix.platform }})
    runs-on: ${{ matrix.os }}

    strategy:
      fail-fast: false
      matrix:
        include:
          - os: windows-latest
            platform: windows
            binary_name: minigit.exe
            release_asset: minigit.exe

          - os: ubuntu-latest
            platform: linux
            binary_name: minigit
            release_asset: minigit-linux

          - os: macos-latest
            platform: macos
            binary_name: minigit
            release_asset: minigit-macos

    steps:
      - name: Checkout repository
        uses: actions/checkout@v5

      - name: Setup ccache
        uses: hendrikmuhs/ccache-action@v1.2
        with:
          key: ${{ matrix.platform }}-${{ matrix.os }}-${{ inputs.build_type || 'Release' }}
          max-size: 500M

      - name: Install dependencies (Linux)
        if: runner.os == 'Linux'
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends \
            libssl-dev \
            zlib1g-dev \
            libcurl4-openssl-dev \
            ninja-build \
            pkg-config
          echo "Verifying Linux required packages via pkg-config..."
          pkg-config --print-errors --exists openssl zlib libcurl || {
            echo "ERROR: Required system packages (OpenSSL, zlib, libcurl) are missing or broken!" >&2
            exit 1
          }

      - name: Install dependencies (macOS)
        if: runner.os == 'macOS'
        run: |
          export HOMEBREW_NO_AUTO_UPDATE=1
          export HOMEBREW_NO_INSTALL_UPGRADE=1

          brew list openssl@3 &>/dev/null || brew install openssl@3
          brew list ninja &>/dev/null || brew install ninja
          brew list curl &>/dev/null || true

          OPENSSL_PREFIX="$(brew --prefix openssl@3 2>/dev/null || echo '/opt/homebrew/opt/openssl@3')"
          if [ ! -d "$OPENSSL_PREFIX" ]; then
            echo "ERROR: OpenSSL@3 installation prefix $OPENSSL_PREFIX not found!" >&2
            exit 1
          fi

      - name: Configure vcpkg binary cache
        if: runner.os == 'Windows'
        shell: pwsh
        run: |
          $cache = "${{ github.workspace }}\.vcpkg-cache"
          New-Item -ItemType Directory -Force -Path $cache | Out-Null
          "VCPKG_DEFAULT_BINARY_CACHE=$cache" | Out-File -FilePath $env:GITHUB_ENV -Encoding utf8 -Append

      - name: Cache vcpkg installed dependencies
        id: vcpkg-cache
        if: runner.os == 'Windows'
        uses: actions/cache@v4
        with:
          path: |
            vcpkg_installed
            .vcpkg-cache
          key: ${{ runner.os }}-vcpkg-installed-${{ hashFiles('vcpkg.json') }}
          restore-keys: |
            ${{ runner.os }}-vcpkg-installed-

      - name: Install dependencies via vcpkg
        if: runner.os == 'Windows'
        shell: pwsh
        run: |
          if ("${{ steps.vcpkg-cache.outputs.cache-hit }}" -ne "true") {
            vcpkg install --triplet x64-windows-static
          }
          $installedDir = "${{ github.workspace }}/vcpkg_installed/x64-windows-static"
          if (-not (Test-Path "$installedDir/include/openssl/evp.h") -or -not (Test-Path "$installedDir/include/zlib.h")) {
            Write-Host "Vcpkg packages missing or corrupted from cache; performing fresh install..."
            vcpkg install --triplet x64-windows-static
          }
          if (-not (Test-Path "$installedDir/include/openssl/evp.h")) {
            Write-Error "ERROR: Required vcpkg package OpenSSL is missing after installation!"
            exit 1
          }

      - name: Configure CMake (Linux)
        if: runner.os == 'Linux'
        run: |
          cmake -B build -S . -G Ninja \
            -DCMAKE_BUILD_TYPE=${{ inputs.build_type || 'Release' }} \
            -DCMAKE_CXX_COMPILER_LAUNCHER=ccache

      - name: Configure CMake (macOS)
        if: runner.os == 'macOS'
        run: |
          OPENSSL_ROOT="$(brew --prefix openssl@3)"

          cmake -B build -S . -G Ninja \
            -DCMAKE_BUILD_TYPE=${{ inputs.build_type || 'Release' }} \
            -DOPENSSL_ROOT_DIR="$OPENSSL_ROOT" \
            -DCMAKE_CXX_COMPILER_LAUNCHER=ccache

      - name: Configure CMake (Windows)
        if: runner.os == 'Windows'
        shell: pwsh
        run: |
          cmake -B build -S . `
            -DVCPKG_TARGET_TRIPLET=x64-windows-static `
            -DVCPKG_INSTALLED_DIR="${{ github.workspace }}/vcpkg_installed" `
            -DCMAKE_TOOLCHAIN_FILE="$env:VCPKG_INSTALLATION_ROOT/scripts/buildsystems/vcpkg.cmake" `
            -DCMAKE_CXX_COMPILER_LAUNCHER=ccache

      - name: Build binary
        run: cmake --build build --config ${{ inputs.build_type || 'Release' }} --parallel

      - name: Run test suite
        run: ctest --test-dir build --output-on-failure --build-config ${{ inputs.build_type || 'Release' }}

      - name: Verify and stage binary (Windows)
        if: runner.os == 'Windows'
        shell: pwsh
        run: |
          $exe = Get-ChildItem -Path build -Filter minigit.exe -Recurse |
            Select-Object -First 1

          if (-not $exe) {
            Write-Error "minigit.exe was not produced by the build!"
            exit 1
          }

          if ($exe.Length -le 0) {
            Write-Error "minigit.exe is empty!"
            exit 1
          }

          Write-Host "Found binary at $($exe.FullName)"
          Write-Host "Size: $($exe.Length) bytes"

          New-Item -ItemType Directory -Path bin -Force | Out-Null
          Copy-Item $exe.FullName -Destination bin\minigit.exe

          Write-Host "Verifying binary execution..."

          $output = & .\bin\minigit.exe 2>&1
          Write-Host $output

          if ($output -notmatch "Usage: minigit") {
            Write-Error "minigit.exe failed execution check!"
            exit 1
          }

          $global:LASTEXITCODE = 0

      - name: Verify and stage binary (Linux / macOS)
        if: runner.os != 'Windows'
        run: |
          BIN=$(find build -type f -name minigit | head -n 1)

          if [ -z "$BIN" ] || [ ! -f "$BIN" ]; then
            echo "minigit binary was not produced by the build!" >&2
            exit 1
          fi

          if [ ! -s "$BIN" ]; then
            echo "minigit binary is empty!" >&2
            exit 1
          fi

          chmod +x "$BIN"

          mkdir -p bin
          cp "$BIN" "bin/${{ matrix.release_asset }}"
          chmod +x "bin/${{ matrix.release_asset }}"

          echo "Found binary at $BIN"
          echo "Verifying binary execution..."

          OUT=$("./bin/${{ matrix.release_asset }}" 2>&1 || true)
          echo "$OUT"

          if ! echo "$OUT" | grep -q "Usage: minigit"; then
            echo "Binary failed execution check!" >&2
            exit 1
          fi

      - name: Upload binary artifact
        if: ${{ inputs.upload_artifacts != false }}
        uses: actions/upload-artifact@v4
        with:
          name: ${{ matrix.release_asset }}
          path: bin/${{ matrix.release_asset }}
          if-no-files-found: error
          retention-days: 7
