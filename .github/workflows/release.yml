name: Build & Release

on:
  push:
    branches:
      - 'main'
    tags:
      - 'v*'
    paths-ignore:
      - '**.md'
      - 'LICENCE'
      - '.gitignore'
  workflow_dispatch:
    inputs:
      release_tag:
        description: 'Release tag to create/update (e.g. v1.0.1 or latest)'
        required: false
        default: 'latest'
        type: string
      release_title:
        description: 'Release title'
        required: false
        default: 'MiniGit Latest'
        type: string

concurrency:
  group: release-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: false

env:
  FORCE_JAVASCRIPT_ACTIONS_TO_NODE24: true

jobs:
  build:
    name: Cross-Platform Build
    uses: ./.github/workflows/build.yml
    with:
      build_type: 'Release'
      upload_artifacts: true

  publish-release:
    name: Publish Release
    needs: build
    runs-on: ubuntu-latest
    permissions:
      contents: write

    steps:
      - name: Checkout repository
        uses: actions/checkout@v5
        with:
          fetch-depth: 0

      - name: Download all binary artifacts
        uses: actions/download-artifact@v4
        with:
          path: release_assets
          merge-multiple: true

      - name: Verify all three platform binaries
        run: |
          cd release_assets
          for asset in minigit.exe minigit-linux minigit-macos; do
            if [ ! -f "$asset" ]; then
              echo "ERROR: Expected release asset $asset is missing!" >&2
              exit 1
            fi
            if [ ! -s "$asset" ]; then
              echo "ERROR: Release asset $asset is empty (0 bytes)!" >&2
              exit 1
            fi
            echo "Verified $asset: $(stat -c%s "$asset") bytes"
          done
          chmod +x minigit-linux minigit-macos
          ls -lh

      - name: Determine release tag and title
        id: meta
        run: |
          if [[ "${{ github.ref }}" == refs/tags/* ]]; then
            TAG_NAME="${{ github.ref_name }}"
            TITLE="MiniGit ${TAG_NAME}"
          elif [[ "${{ github.ref }}" == refs/heads/main ]]; then
            TAG_NAME="latest"
            TITLE="MiniGit Latest"
          else
            TAG_NAME="${{ inputs.release_tag || 'latest' }}"
            TITLE="${{ inputs.release_title || 'MiniGit Latest' }}"
          fi
          echo "tag=$TAG_NAME" >> $GITHUB_OUTPUT
          echo "title=$TITLE" >> $GITHUB_OUTPUT

      - name: Generate release notes
        run: |
          SHORT_SHA="${GITHUB_SHA:0:7}"
          DATE_UTC=$(date -u +"%Y-%m-%d %H:%M:%S UTC")
          TAG="${{ steps.meta.outputs.tag }}"
          TITLE="${{ steps.meta.outputs.title }}"
          cat <<EOF > release_notes.md
          ## ${TITLE}

          Automated release containing verified cross-platform builds of **MiniGit**.

          - **Target:** \`${TAG}\`
          - **Commit:** [\`${SHORT_SHA}\`](https://github.com/${{ github.repository }}/commit/${GITHUB_SHA})
          - **Build Date:** \`${DATE_UTC}\`
          - **Platforms:** Windows (x86_64), Linux (x86_64), macOS (Apple Silicon arm64)

          ### Direct Downloads

          | Platform | Architecture | Binary | Direct Download Link |
          | :--- | :--- | :--- | :--- |
          | **Windows** | x86_64 | \`minigit.exe\` | [Download \`minigit.exe\`](https://github.com/${{ github.repository }}/releases/download/${TAG}/minigit.exe) |
          | **Linux** | x86_64 | \`minigit-linux\` | [Download \`minigit-linux\`](https://github.com/${{ github.repository }}/releases/download/${TAG}/minigit-linux) |
          | **macOS** | Apple Silicon (arm64) | \`minigit-macos\` | [Download \`minigit-macos\`](https://github.com/${{ github.repository }}/releases/download/${TAG}/minigit-macos) |

          ---
          *Cross-platform binaries compiled and verified by automated CI.*
          EOF

      - name: Publish or update release
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          TAG: ${{ steps.meta.outputs.tag }}
          TITLE: ${{ steps.meta.outputs.title }}
        run: |
          if gh release view "$TAG" --repo "${{ github.repository }}" >/dev/null 2>&1; then
            echo "Release '$TAG' exists. Updating tag pointer if permitted..."
            git config user.name "github-actions[bot]"
            git config user.email "github-actions[bot]@users.noreply.github.com"
            git tag -f "$TAG" "${{ github.sha }}" 2>/dev/null || true
            git push -f origin "$TAG" 2>/dev/null || echo "Notice: Tag '$TAG' pointer push skipped or protected by repository rules; proceeding to update release assets and metadata."

            echo "Uploading and replacing assets (--clobber)..."
            gh release upload "$TAG" \
              release_assets/minigit.exe \
              release_assets/minigit-linux \
              release_assets/minigit-macos \
              --repo "${{ github.repository }}" \
              --clobber

            echo "Updating release title and release notes..."
            gh release edit "$TAG" \
              --repo "${{ github.repository }}" \
              --title "$TITLE" \
              --notes-file release_notes.md
          else
            echo "Release '$TAG' does not exist. Creating new release..."
            gh release create "$TAG" \
              release_assets/minigit.exe \
              release_assets/minigit-linux \
              release_assets/minigit-macos \
              --repo "${{ github.repository }}" \
              --title "$TITLE" \
              --notes-file release_notes.md \
              --target "${{ github.sha }}"
          fi
          echo "Release '$TAG' published/updated successfully."
