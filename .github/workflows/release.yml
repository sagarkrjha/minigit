name: Build & Release

on:
  push:
    branches:
      - 'main'
    tags:
      - 'v*'
    paths-ignore:
      - '**.md'
      - 'LICENCE'
      - '.gitignore'
  workflow_dispatch:
    inputs:
      release_tag:
        description: 'Release tag (e.g. v1.0.0)'
        required: false
        default: ''
        type: string
      release_title:
        description: 'Release title'
        required: false
        default: ''
        type: string

concurrency:
  group: release-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: false

env:
  FORCE_JAVASCRIPT_ACTIONS_TO_NODE24: true

jobs:
  build:
    name: Cross-Platform Build
    uses: ./.github/workflows/build.yml
    with:
      build_type: 'Release'
      upload_artifacts: true

  publish-release:
    name: Publish Release
    needs: build
    runs-on: ubuntu-latest
    permissions:
      contents: write

    steps:
      - name: Checkout repository
        uses: actions/checkout@v5
        with:
          fetch-depth: 0

      - name: Download all binary artifacts
        uses: actions/download-artifact@v4
        with:
          path: release_assets
          merge-multiple: true

      - name: Verify all three platform binaries
        run: |
          cd release_assets
          for asset in minigit.exe minigit-linux minigit-macos; do
            if [ ! -f "$asset" ]; then
              echo "ERROR: Expected release asset $asset is missing!" >&2
              exit 1
            fi
            if [ ! -s "$asset" ]; then
              echo "ERROR: Release asset $asset is empty (0 bytes)!" >&2
              exit 1
            fi
            echo "Verified $asset: $(stat -c%s "$asset") bytes"
          done
          chmod +x minigit-linux minigit-macos
          ls -lh

      - name: Determine release tag and title
        id: meta
        run: |
          if [[ "${{ github.ref }}" == refs/tags/* ]]; then
            TAG_NAME="${{ github.ref_name }}"
            TITLE="MiniGit ${TAG_NAME}"
          elif [[ -n "${{ inputs.release_tag }}" ]]; then
            TAG_NAME="${{ inputs.release_tag }}"
            if [[ -n "${{ inputs.release_title }}" ]]; then
              TITLE="${{ inputs.release_title }}"
            else
              TITLE="MiniGit ${TAG_NAME}"
            fi
          else
            CMAKE_VER=$(sed -n '/project *(.*minigit/,/)/p' CMakeLists.txt | grep -E 'VERSION' | sed -E 's/.*VERSION[[:space:]]+([0-9.]+).*/\1/' | head -n 1)
            if [[ -z "$CMAKE_VER" ]]; then
              echo "ERROR: Could not extract version from CMakeLists.txt" >&2
              exit 1
            fi
            TAG_NAME="v${CMAKE_VER}"
            TITLE="MiniGit ${TAG_NAME}"
          fi
          echo "tag=$TAG_NAME" >> $GITHUB_OUTPUT
          echo "title=$TITLE" >> $GITHUB_OUTPUT

      - name: Generate release notes
        run: |
          SHORT_SHA="${GITHUB_SHA:0:7}"
          DATE_UTC=$(date -u +"%Y-%m-%d %H:%M:%S UTC")
          TAG="${{ steps.meta.outputs.tag }}"
          TITLE="${{ steps.meta.outputs.title }}"
          cat <<EOF > release_notes.md
          ## ${TITLE}

          Automated release containing verified cross-platform builds of **MiniGit ${TAG}**.

          - **Version:** \`${TAG}\`
          - **Commit:** [\`${SHORT_SHA}\`](https://github.com/${{ github.repository }}/commit/${GITHUB_SHA})
          - **Build Date:** \`${DATE_UTC}\`
          - **Platforms:** Windows (x86_64), Linux (x86_64), macOS (Apple Silicon arm64)

          ### Direct Downloads

          | Platform | Architecture | Binary | Direct Download Link |
          | :--- | :--- | :--- | :--- |
          | **Windows** | x86_64 | \`minigit.exe\` | [Download \`minigit.exe\`](https://github.com/${{ github.repository }}/releases/download/${TAG}/minigit.exe) |
          | **Linux** | x86_64 | \`minigit-linux\` | [Download \`minigit-linux\`](https://github.com/${{ github.repository }}/releases/download/${TAG}/minigit-linux) |
          | **macOS** | Apple Silicon (arm64) | \`minigit-macos\` | [Download \`minigit-macos\`](https://github.com/${{ github.repository }}/releases/download/${TAG}/minigit-macos) |

          ---
          *Cross-platform binaries compiled and verified by automated CI.*
          EOF

      - name: Publish versioned release
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          TAG: ${{ steps.meta.outputs.tag }}
          TITLE: ${{ steps.meta.outputs.title }}
        run: |
          if gh release view "$TAG" --repo "${{ github.repository }}" >/dev/null 2>&1; then
            echo "Release '$TAG' already exists on GitHub."
            echo "Repository rules enforce immutable releases. Skipping creation to avoid clobbering existing release."
            echo "To publish a new version, bump the VERSION in CMakeLists.txt or push a new version tag (e.g. v1.0.1)."
            exit 0
          fi

          echo "Creating new versioned release '$TAG'..."
          gh release create "$TAG" \
            release_assets/minigit.exe \
            release_assets/minigit-linux \
            release_assets/minigit-macos \
            --repo "${{ github.repository }}" \
            --title "$TITLE" \
            --notes-file release_notes.md \
            --target "${{ github.sha }}" \
            --latest

          echo "Versioned release '$TAG' created and published successfully as latest."
