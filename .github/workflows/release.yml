name: Build & Release

on:
  push:
    branches:
      - 'main'
    tags:
      - 'v*'
    paths-ignore:
      - '**.md'
      - 'LICENCE'
      - '.gitignore'
  workflow_dispatch:
    inputs:
      release_tag:
        description: 'Release tag (e.g. v1.0.0)'
        required: false
        default: ''
        type: string
      release_title:
        description: 'Release title'
        required: false
        default: ''
        type: string

concurrency:
  group: release-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: false

env:
  FORCE_JAVASCRIPT_ACTIONS_TO_NODE24: true

jobs:
  build:
    name: Cross-Platform Build
    uses: ./.github/workflows/build.yml
    with:
      build_type: 'Release'
      upload_artifacts: true

  publish-release:
    name: Publish Release
    needs: build
    runs-on: ubuntu-latest
    permissions:
      contents: write

    steps:
      - name: Checkout repository
        uses: actions/checkout@v5
        with:
          fetch-depth: 0

      - name: Download all binary artifacts
        uses: actions/download-artifact@v4
        with:
          path: release_assets
          merge-multiple: true

      - name: Verify all three platform binaries
        run: |
          cd release_assets
          for asset in minigit.exe minigit-linux minigit-macos; do
            if [ ! -f "$asset" ]; then
              echo "ERROR: Expected release asset $asset is missing!" >&2
              exit 1
            fi
            if [ ! -s "$asset" ]; then
              echo "ERROR: Release asset $asset is empty (0 bytes)!" >&2
              exit 1
            fi
            echo "Verified $asset: $(stat -c%s "$asset") bytes"
          done
          chmod +x minigit-linux minigit-macos
          ls -lh

      - name: Setup Node.js & pnpm
        uses: pnpm/action-setup@v4
        with:
          version: 12.6.0

      - name: Build documentation website with bundled release assets
        run: |
          mkdir -p website/public/assets
          cp release_assets/minigit.exe website/public/assets/
          cp release_assets/minigit-linux website/public/assets/
          cp release_assets/minigit-macos website/public/assets/
          cd website
          pnpm install --frozen-lockfile
          pnpm build
          tar -czf ../release_assets/minigit-docs-website.tar.gz -C .next/standalone . 2>/dev/null || tar -czf ../release_assets/minigit-docs-website.tar.gz .
          cd ..
          ls -lh release_assets/minigit-docs-website.tar.gz
          ls -lh website/public/assets/

      - name: Determine release tag and title
        id: meta
        run: |
          if [[ "${{ github.ref }}" == refs/tags/* ]]; then
            TAG_NAME="${{ github.ref_name }}"
            TITLE="MiniGit ${TAG_NAME}"
          elif [[ -n "${{ inputs.release_tag }}" ]]; then
            TAG_NAME="${{ inputs.release_tag }}"
            if [[ -n "${{ inputs.release_title }}" ]]; then
              TITLE="${{ inputs.release_title }}"
            else
              TITLE="MiniGit ${TAG_NAME}"
            fi
          else
            CMAKE_VER=$(sed -n '/project *(.*minigit/,/)/p' CMakeLists.txt | grep -E 'VERSION' | sed -E 's/.*VERSION[[:space:]]+([0-9.]+).*/\1/' | head -n 1)
            if [[ -z "$CMAKE_VER" ]]; then
              echo "ERROR: Could not extract version from CMakeLists.txt" >&2
              exit 1
            fi
            TAG_NAME="v${CMAKE_VER}"
            TITLE="MiniGit ${TAG_NAME}"
          fi
          echo "tag=$TAG_NAME" >> $GITHUB_OUTPUT
          echo "title=$TITLE" >> $GITHUB_OUTPUT

      - name: Compute cryptographic SHA-256 checksums
        run: |
          cd release_assets
          sha256sum minigit.exe minigit-linux minigit-macos minigit-docs-website.tar.gz > SHA256SUMS.txt
          cat SHA256SUMS.txt

      - name: Generate release notes
        run: |
          SHORT_SHA="${GITHUB_SHA:0:7}"
          DATE_UTC=$(date -u +"%Y-%m-%d %H:%M:%S UTC")
          TAG="${{ steps.meta.outputs.tag }}"
          TITLE="${{ steps.meta.outputs.title }}"
          cat <<EOF > release_notes.md
          ## ${TITLE}

          Automated release containing verified cross-platform builds of **MiniGit ${TAG}** and the official documentation website bundle.

          - **Version:** \`${TAG}\`
          - **Commit:** [\`${SHORT_SHA}\`](https://github.com/${{ github.repository }}/commit/${GITHUB_SHA})
          - **Build Date:** \`${DATE_UTC}\`
          - **Platforms:** Windows (x86_64), Linux (x86_64), macOS (Apple Silicon arm64)

          ### Direct Downloads & Checksums

          | Platform / Asset | Architecture | Binary / Bundle | Direct Download Link |
          | :--- | :--- | :--- | :--- |
          | **Windows** | x86_64 | \`minigit.exe\` | [Download \`minigit.exe\`](https://github.com/${{ github.repository }}/releases/download/${TAG}/minigit.exe) |
          | **Linux** | x86_64 | \`minigit-linux\` | [Download \`minigit-linux\`](https://github.com/${{ github.repository }}/releases/download/${TAG}/minigit-linux) |
          | **macOS** | Apple Silicon (arm64) | \`minigit-macos\` | [Download \`minigit-macos\`](https://github.com/${{ github.repository }}/releases/download/${TAG}/minigit-macos) |
          | **Docs Website** | Static / Standalone | \`minigit-docs-website.tar.gz\` | [Download \`minigit-docs-website.tar.gz\`](https://github.com/${{ github.repository }}/releases/download/${TAG}/minigit-docs-website.tar.gz) |
          | **Checksums** | Any | \`SHA256SUMS.txt\` | [Download \`SHA256SUMS.txt\`](https://github.com/${{ github.repository }}/releases/download/${TAG}/SHA256SUMS.txt) |

          \`\`\`text
          $(cat release_assets/SHA256SUMS.txt)
          \`\`\`

          ---
          *Cross-platform binaries compiled and verified by automated CI.*
          EOF

      - name: Publish or update versioned release
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          TAG: ${{ steps.meta.outputs.tag }}
          TITLE: ${{ steps.meta.outputs.title }}
        run: |
          if gh release view "$TAG" --repo "${{ github.repository }}" >/dev/null 2>&1; then
            echo "Release '$TAG' already exists on GitHub. Updating release assets..."
            gh release upload "$TAG" \
              release_assets/minigit.exe \
              release_assets/minigit-linux \
              release_assets/minigit-macos \
              release_assets/minigit-docs-website.tar.gz \
              release_assets/SHA256SUMS.txt \
              --repo "${{ github.repository }}" \
              --clobber
            echo "Release assets for '$TAG' updated successfully."
          else
            echo "Creating new versioned release '$TAG'..."
            gh release create "$TAG" \
              release_assets/minigit.exe \
              release_assets/minigit-linux \
              release_assets/minigit-macos \
              release_assets/minigit-docs-website.tar.gz \
              release_assets/SHA256SUMS.txt \
              --repo "${{ github.repository }}" \
              --title "$TITLE" \
              --notes-file release_notes.md \
              --target "${{ github.sha }}" \
              --latest
            echo "Versioned release '$TAG' created and published successfully as latest."
          fi
