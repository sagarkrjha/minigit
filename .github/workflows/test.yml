name: Tests

on:
  pull_request:
    branches:
      - '**'
    paths-ignore:
      - '**.md'
      - 'LICENCE'
      - '.gitignore'
  push:
    paths-ignore:
      - '**.md'
      - 'LICENCE'
      - '.gitignore'
  workflow_dispatch:

concurrency:
  group: test-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

env:
  FORCE_JAVASCRIPT_ACTIONS_TO_NODE24: true

jobs:
  test:
    name: Test (${{ matrix.platform }})
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: windows-latest
            platform: windows
            binary: minigit.exe
            release_asset: minigit.exe
            compiler_cache: sccache
          - os: ubuntu-latest
            platform: linux
            binary: minigit
            release_asset: minigit-linux
            compiler_cache: ccache
          - os: macos-latest
            platform: macos
            binary: minigit
            release_asset: minigit-macos
            compiler_cache: ccache

    steps:
      - name: Checkout repository
        uses: actions/checkout@v5

      # --- Setup MSVC Developer Command Prompt (Windows) ---
      - name: Setup MSVC Developer Command Prompt
        if: runner.os == 'Windows'
        uses: ilammy/msvc-dev-cmd@v1

      # --- Setup Compiler Cache (ccache / sccache) ---
      - name: Setup compiler cache (${{ matrix.compiler_cache }})
        uses: hendrikmuhs/ccache-action@v1.2
        with:
          variant: ${{ matrix.compiler_cache }}
          key: ${{ matrix.platform }}-${{ matrix.os }}-${{ matrix.compiler_cache }}
          max-size: 500M

      # --- Linux dependencies ---
      - name: Install dependencies (Linux)
        if: runner.os == 'Linux'
        run: |
          if ! pkg-config --exists openssl zlib; then
            sudo apt-get update
            sudo apt-get install -y --no-install-recommends libssl-dev zlib1g-dev ninja-build
          fi

      # --- macOS dependencies ---
      - name: Install dependencies (macOS)
        if: runner.os == 'macOS'
        run: |
          export HOMEBREW_NO_AUTO_UPDATE=1
          export HOMEBREW_NO_INSTALL_UPGRADE=1
          if ! brew list openssl@3 &>/dev/null && ! brew list openssl &>/dev/null; then
            brew install openssl
          fi
          if ! brew list ninja &>/dev/null; then
            brew install ninja
          fi

      # --- Windows dependencies & proper vcpkg binary cache ---
      - name: Setup vcpkg binary cache environment (Windows)
        if: runner.os == 'Windows'
        run: |
          $cacheDir = "${{ runner.temp }}\vcpkg_cache"
          New-Item -ItemType Directory -Path $cacheDir -Force | Out-Null
          "VCPKG_DEFAULT_BINARY_CACHE=$cacheDir" | Out-File -FilePath $env:GITHUB_ENV -Encoding utf8 -Append
          "VCPKG_ROOT=C:\vcpkg" | Out-File -FilePath $env:GITHUB_ENV -Encoding utf8 -Append

      - name: Cache vcpkg binary archives (Windows)
        if: runner.os == 'Windows'
        uses: actions/cache@v4
        with:
          path: |
            ${{ runner.temp }}/vcpkg_cache
            C:\Users\runneradmin\AppData\Local\vcpkg\archives
          key: ${{ runner.os }}-vcpkg-archives-${{ hashFiles('**/CMakeLists.txt') }}
          restore-keys: |
            ${{ runner.os }}-vcpkg-archives-

      - name: Install dependencies via vcpkg (Windows)
        if: runner.os == 'Windows'
        run: |
          vcpkg install openssl:x64-windows-static zlib:x64-windows-static

      # --- Configure CMake ---
      - name: Configure CMake (Linux)
        if: runner.os == 'Linux'
        run: |
          cmake -B build -S . -G Ninja \
            -DCMAKE_BUILD_TYPE=Release \
            -DBUILD_TESTING=ON \
            -DCMAKE_C_COMPILER_LAUNCHER=ccache \
            -DCMAKE_CXX_COMPILER_LAUNCHER=ccache

      - name: Configure CMake (macOS)
        if: runner.os == 'macOS'
        run: |
          OPENSSL_ROOT="$(brew --prefix openssl@3 2>/dev/null || brew --prefix openssl 2>/dev/null || echo '/opt/homebrew/opt/openssl')"
          cmake -B build -S . -G Ninja \
            -DCMAKE_BUILD_TYPE=Release \
            -DBUILD_TESTING=ON \
            -DOPENSSL_ROOT_DIR="$OPENSSL_ROOT" \
            -DCMAKE_C_COMPILER_LAUNCHER=ccache \
            -DCMAKE_CXX_COMPILER_LAUNCHER=ccache

      - name: Configure CMake (Windows)
        if: runner.os == 'Windows'
        run: |
          cmake -B build -S . -G Ninja `
            -DCMAKE_BUILD_TYPE=Release `
            -DBUILD_TESTING=ON `
            -DVCPKG_TARGET_TRIPLET=x64-windows-static `
            -DCMAKE_TOOLCHAIN_FILE="$env:VCPKG_INSTALLATION_ROOT/scripts/buildsystems/vcpkg.cmake" `
            -DCMAKE_C_COMPILER_LAUNCHER=sccache `
            -DCMAKE_CXX_COMPILER_LAUNCHER=sccache `
            -DCMAKE_MSVC_DEBUG_INFORMATION_FORMAT=Embedded

      # --- Build ---
      - name: Build binaries and test suite
        run: |
          cmake --build build --config Release --target minigit minigit_tests --parallel

      # --- Run CTest Suite ---
      - name: Run CTest Automated Suite
        run: |
          ctest --test-dir build --output-on-failure --build-config Release

      # --- End-to-End CLI Smoke Test ---
      - name: Run CLI Smoke Test (Windows)
        if: runner.os == 'Windows'
        run: |
          $testRepo = "$((Get-Item .).FullName)\build\smoke_test_repo"
          if (Test-Path $testRepo) { Remove-Item -Recurse -Force $testRepo }
          New-Item -ItemType Directory -Path $testRepo | Out-Null
          $exePath = "build\${{ matrix.binary }}"
          if (-not (Test-Path $exePath)) {
            $found = Get-ChildItem -Path build -Filter ${{ matrix.binary }} -Recurse | Select-Object -First 1
            if ($found) { Copy-Item $found.FullName -Destination $exePath }
          }
          if (-not (Test-Path $exePath)) {
            Write-Error "${{ matrix.binary }} was not produced by the build!"
            exit 1
          }
          $exe = (Resolve-Path $exePath).Path
          Push-Location $testRepo
          try {
            & $exe init
            "smoke test content" | Set-Content "file.txt"
            & $exe add file.txt
            & $exe commit -m "smoke test commit"
            & $exe log
            & $exe branch smoke-branch
            & $exe switch smoke-branch
            "second line" | Add-Content "file.txt"
            & $exe diff
            & $exe add file.txt
            & $exe commit -m "second commit"
            & $exe tag v-smoke
            & $exe show
            "untracked text" | Set-Content "untracked.tmp"
            & $exe ls-files -o
            & $exe ls-tree HEAD
            & $exe clean -n
            & $exe clean -f
            & $exe worktree add wt-smoke -b smoke-wt-branch
            & $exe worktree list
            & $exe worktree list --porcelain
            & $exe worktree remove wt-smoke
            & $exe worktree prune
            $subRepo = "$((Get-Item .).FullName)\..\smoke_sub_repo"
            if (Test-Path $subRepo) { Remove-Item -Recurse -Force $subRepo }
            New-Item -ItemType Directory -Path $subRepo | Out-Null
            Push-Location $subRepo
            & $exe init
            "sub content" | Set-Content "sub.txt"
            & $exe add sub.txt
            & $exe commit -m "sub initial"
            Pop-Location
            & $exe submodule add $subRepo sub_dir
            & $exe submodule status
            & $exe submodule foreach echo submodule_ok
            & $exe submodule deinit sub_dir
            & $exe submodule update --init
            Remove-Item -Recurse -Force $subRepo
            Write-Host "Windows CLI smoke tests passed successfully!"
          } finally {
            Pop-Location
            Remove-Item -Recurse -Force $testRepo
          }

      - name: Run CLI Smoke Test (Linux / macOS)
        if: runner.os != 'Windows'
        run: |
          TEST_REPO="$(pwd)/build/smoke_test_repo"
          rm -rf "$TEST_REPO"
          mkdir -p "$TEST_REPO"
          EXE=$(find build -type f -name "${{ matrix.binary }}" -not -path "*/CMakeFiles/*" -not -path "*/smoke_test_repo/*" | head -n 1)
          if [ -z "$EXE" ] || [ ! -f "$EXE" ]; then
            if [ -f "build/${{ matrix.binary }}" ]; then
              EXE="build/${{ matrix.binary }}"
            elif [ -f "build/src/${{ matrix.binary }}" ]; then
              EXE="build/src/${{ matrix.binary }}"
            else
              echo "minigit executable not found in build directory!" >&2
              find build -maxdepth 3 -ls >&2
              exit 1
            fi
          fi
          EXE="$(cd "$(dirname "$EXE")" && pwd)/$(basename "$EXE")"
          chmod +x "$EXE"
          cd "$TEST_REPO"
          "$EXE" init
          echo "smoke test content" > file.txt
          "$EXE" add file.txt
          "$EXE" commit -m "smoke test commit"
          "$EXE" log
          "$EXE" branch smoke-branch
          "$EXE" switch smoke-branch
          echo "second line" >> file.txt
          "$EXE" diff
          "$EXE" add file.txt
          "$EXE" commit -m "second commit"
          "$EXE" tag v-smoke
          "$EXE" show
          echo "untracked text" > untracked.tmp
          "$EXE" ls-files -o
          "$EXE" ls-tree HEAD
          "$EXE" clean -n
          "$EXE" clean -f
          "$EXE" worktree add wt-smoke -b smoke-wt-branch
          "$EXE" worktree list
          "$EXE" worktree list --porcelain
          "$EXE" worktree remove wt-smoke
          "$EXE" worktree prune
          SUB_REPO="$(pwd)/../smoke_sub_repo"
          rm -rf "$SUB_REPO"
          mkdir -p "$SUB_REPO"
          cd "$SUB_REPO"
          "$EXE" init
          echo "sub content" > sub.txt
          "$EXE" add sub.txt
          "$EXE" commit -m "sub initial"
          cd "$TEST_REPO"
          "$EXE" submodule add "$SUB_REPO" sub_dir
          "$EXE" submodule status
          "$EXE" submodule foreach echo submodule_ok
          "$EXE" submodule deinit sub_dir
          "$EXE" submodule update --init
          rm -rf "$SUB_REPO"
          cd -
          rm -rf "$TEST_REPO"
          echo "POSIX CLI smoke tests passed successfully!"

      # --- Stage and Upload Artifacts ---
      - name: Stage binary artifact (Windows)
        if: runner.os == 'Windows'
        run: |
          New-Item -ItemType Directory -Path bin -Force | Out-Null
          $exePath = "build\${{ matrix.binary }}"
          if (-not (Test-Path $exePath)) {
            $found = Get-ChildItem -Path build -Filter ${{ matrix.binary }} -Recurse | Select-Object -First 1
            $exePath = $found.FullName
          }
          Copy-Item $exePath -Destination "bin\${{ matrix.release_asset }}"

      - name: Stage binary artifact (Linux / macOS)
        if: runner.os != 'Windows'
        run: |
          mkdir -p bin
          EXE=$(find build -type f -name "${{ matrix.binary }}" -not -path "*/CMakeFiles/*" -not -path "*/smoke_test_repo/*" | head -n 1)
          cp "$EXE" "bin/${{ matrix.release_asset }}"
          chmod +x "bin/${{ matrix.release_asset }}"

      - name: Upload binary artifact
        uses: actions/upload-artifact@v4
        with:
          name: ${{ matrix.release_asset }}
          path: bin/${{ matrix.release_asset }}
          if-no-files-found: error
          retention-days: 7
