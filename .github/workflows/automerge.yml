name: Automerge PR

on:
  pull_request_target:
    types:
      - opened
      - synchronize
      - reopened
      - ready_for_review
      - closed
  pull_request_review:
    types:
      - submitted
  workflow_dispatch:
    inputs:
      pr_number:
        description: 'Pull Request number to enable automerge on'
        required: true
        type: string

permissions:
  contents: write
  pull-requests: write

env:
  FORCE_JAVASCRIPT_ACTIONS_TO_NODE24: true

jobs:
  automerge:
    name: Enable Auto-Merge
    runs-on: ubuntu-latest
    if: github.event.pull_request.draft == false || github.event_name == 'workflow_dispatch'
    steps:
      - name: Configure Auto-Merge & Delete Branch
        env:
          GH_TOKEN: ${{ secrets.AUTO_MERGE_PAT || secrets.GITHUB_TOKEN }}
        run: |
          # If triggered after PR merge, delete the merged feature branch
          if [ "${{ github.event.pull_request.merged }}" = "true" ]; then
            BRANCH="${{ github.event.pull_request.head.ref }}"
            if [ -n "$BRANCH" ] && [ "$BRANCH" != "main" ]; then
              echo "PR merged. Deleting feature branch '$BRANCH'..."
              gh api -X DELETE "repos/${{ github.repository }}/git/refs/heads/$BRANCH" || true
            fi
            exit 0
          fi

          PR_URL="${{ github.event.pull_request.html_url }}"
          if [ -z "$PR_URL" ] && [ -n "${{ inputs.pr_number }}" ]; then
            PR_URL="https://github.com/${{ github.repository }}/pull/${{ inputs.pr_number }}"
          fi

          if [ -n "${{ secrets.AUTO_MERGE_PAT }}" ]; then
            echo "Using custom AUTO_MERGE_PAT token."
          else
            echo "WARNING: AUTO_MERGE_PAT secret is not set; falling back to default GITHUB_TOKEN."
          fi

          echo "Enabling auto-merge (squash with branch deletion) for $PR_URL..."
          gh pr merge "$PR_URL" --auto --squash --delete-branch || {
            echo "Auto-merge command returned non-zero. Ensure 'Allow auto-merge' is enabled in repo settings."
          }
